[phases.setup]
nixPkgs = ["php81", "php81Extensions.pdo", "php81Extensions.pdo_pgsql", "php81Extensions.pgsql", "php81Extensions.mbstring", "php81Extensions.xml", "php81Extensions.curl", "php81Extensions.zip", "php81Extensions.gd", "php81Extensions.fileinfo", "php81Extensions.openssl", "php81Extensions.tokenizer", "php81Extensions.json", "php81Extensions.bcmath", "php81Extensions.ctype", "php81Extensions.dom", "php81Extensions.filter", "php81Extensions.hash", "php81Extensions.iconv", "php81Extensions.intl", "php81Extensions.libxml", "php81Extensions.pcre", "php81Extensions.session", "php81Extensions.simplexml", "php81Extensions.spl", "php81Extensions.xmlreader", "php81Extensions.xmlwriter"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT" 